    const quizContainer = document.getElementById("quiz-container");
    const contentContainer = document.getElementById("content-questions");
    const methodologyContainer = document.getElementById("methodology-questions");
    let isQuizActive = true;

    function loadQuestions() {
        questionsData.forEach((q, index) => {
            let optionsHTML = '';
            q.options.forEach(opt => {
                optionsHTML += `
                    <li>
                        <label>
                            <input type="radio" name="q${q.id}" value="${opt.id}">
                            <b>${opt.id}.</b> <span style="margin-left: 5px;">${opt.te}</span>
                        </label>
                    </li>
                `;
            });

            const questionHTML = `
                <div class="question-card" id="card-${q.id}">
                    <div class="question-text">
                        ప్ర ${index + 1}. ${q.q_te}
                    </div>
                    <ul class="options">
                        ${optionsHTML}
                    </ul>
                    <div class="btn-group">
                        <button class="btn-hint" onclick="showHint(${q.id})">💡 సూచన</button>
                        <button class="btn-check" onclick="checkAnswer(${q.id}, '${q.answer}')">✅ సరిచూసుకోండి</button>
                    </div>
                    <div id="feedback-${q.id}" class="feedback-box">
                        <strong id="result-msg-${q.id}"></strong>
                        <div class="explanation">
                            <b style="color:#d35400;">వివరణ:</b> ${q.exp_te}
                        </div>
                    </div>
                </div>
            `;
            
            // Append to appropriate section based on type
            if(q.type === "content") {
                contentContainer.innerHTML += questionHTML;
            } else {
                methodologyContainer.innerHTML += questionHTML;
            }
        });
    }

    // Timer Implementation (30 Minutes)
    let timeLeft = 30 * 60; // 30 minutes in seconds
    let timerInterval;

    function startTimer() {
        const timeText = document.getElementById('time-text');
        const timerContainer = document.getElementById('timer');
        
        timerInterval = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timeText.innerHTML = "సమయం ముగిసింది!";
                timerContainer.classList.add("timer-warning");
                disableQuiz();
                alert("మీ సమయం ముగిసింది! క్విజ్ లాక్ చేయబడింది.");
            } else {
                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;
                
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;
                
                timeText.innerHTML = `సమయం: ${minutes}:${seconds}`;
                
                // Add warning style in the last 5 minutes (300 seconds)
                if(timeLeft <= 300) {
                    timerContainer.classList.add("timer-warning");
                }
            }
            timeLeft--;
        }, 1000);
    }

    // Disable all inputs when time is up
    function disableQuiz() {
        isQuizActive = false;
        const inputs = document.querySelectorAll('input[type="radio"]');
        inputs.forEach(input => input.disabled = true);
        
        const buttons = document.querySelectorAll('.btn-check, .btn-hint');
        buttons.forEach(button => button.disabled = true);
    }

    const hintModal = document.getElementById("hintModal");
    function showHint(id) {
        if(!isQuizActive) return;
        const q = questionsData.find(item => item.id === id);
        document.getElementById("hintTextTe").innerText = q.hint_te;
        hintModal.style.display = "block";
    }
    
    function closeHint() { hintModal.style.display = "none"; }
    window.onclick = function(event) {
        if (event.target == hintModal) { hintModal.style.display = "none"; }
    }

    function checkAnswer(id, correctAnswer) {
        if(!isQuizActive) return;
        
        const selectedOption = document.querySelector(`input[name="q${id}"]:checked`);
        const feedbackBox = document.getElementById(`feedback-${id}`);
        const resultMsg = document.getElementById(`result-msg-${id}`);

        if (!selectedOption) {
            alert("దయచేసి ముందుగా ఒక జవాబును ఎంచుకోండి!");
            return;
        }

        feedbackBox.style.display = "block";
        if (selectedOption.value === correctAnswer) {
            feedbackBox.className = "feedback-box correct";
            resultMsg.innerText = "🎉 సరైన సమాధానం!";
        } else {
            feedbackBox.className = "feedback-box incorrect";
            resultMsg.innerText = `❌ తప్పు సమాధానం. సరైన జవాబు '${correctAnswer}'.`;
        }
    }

    window.onload = function() {
        loadQuestions();
        startTimer(); // Start timer as soon as page loads
    };

</script>
