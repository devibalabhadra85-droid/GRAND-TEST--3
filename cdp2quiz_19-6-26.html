        {
            id: 1,
            q_en: "A child who knows that dogs have four legs sees a cow for the first time and calls it a 'big dog'. Later, the child learns to call it a 'cow'. According to Piaget, the process of modifying existing knowledge is called:",

            options: [
                { id: "A", en: "Assimilation", te: "సాంశీకరణం (Assimilation)" },
                { id: "B", en: "Accommodation", te: "అనుగుణ్యం (Accommodation)" },
                { id: "C", en: "Equilibration", te: "సమతుల్యత" },
                { id: "D", en: "Object Permanence", te: "వస్తు స్థిరత్వం" }
            ],
            answer: "B",
            hint_en: "Changing the existing schema to fit new information.", hint_te: "కొత్త సమాచారానికి అనుగుణంగా పాత జ్ఞానాన్ని (స్కీమాను) మార్చుకోవడం.",
            exp_en: "Accommodation is the cognitive process of altering one's existing schemas as a result of new information or experiences (e.g., differentiating a cow from a dog).", 
            exp_te: "పాత జ్ఞానాన్ని (కుక్క) మార్చుకుని, ఆవుకు కొత్త భావన (స్కీమా) ఏర్పరుచుకోవడాన్ని 'అనుగుణ్యం' అంటారు."
        },
        {
            id: 2,
            q_en: "A teacher provides a partially completed graphic organizer to help students write an essay. As students become more capable, the teacher provides less help. This instructional support is an example of:",
            q_te: "వ్యాసం రాయడంలో విద్యార్థులకు సహాయపడటానికి ఉపాధ్యాయుడు పాక్షికంగా పూర్తి చేసిన గ్రాఫిక్ ఆర్గనైజర్‌ను అందిస్తాడు. విద్యార్థుల సామర్థ్యం పెరిగేకొద్దీ, ఉపాధ్యాయుడు సహాయాన్ని తగ్గిస్తాడు. ఈ బోధనా మద్దతు దేనికి ఉదాహరణ?",

                { id: "A", en: "Conditioning", te: "నిబంధనం" },
                { id: "B", en: "Scaffolding", te: "మరకట్టుట (Scaffolding)" },
                { id: "C", en: "Positive Reinforcement", te: "అనుకూల పునర్బలనం" },
                { id: "D", en: "Classical Conditioning", te: "శాస్త్రీయ నిబంధనం" }
            ],
            answer: "B",
            hint_en: "Temporary support given by a More Knowledgeable Other (MKO).", hint_te: "పని పూర్తయ్యే వరకు మాత్రమే ఇచ్చే తాత్కాలిక మద్దతు.",
            exp_en: "Scaffolding refers to a teaching method where the educator provides temporary support to students and gradually removes it as students develop competence.", 
            exp_te: "వైగోట్స్కీ సిద్ధాంతం ప్రకారం, విద్యార్థి సొంతంగా పని చేయగలిగే స్థాయికి వచ్చే వరకు ఉపాధ్యాయుడు అందించే తాత్కాలిక మద్దతును స్కాఫోల్డింగ్ అంటారు."
        },
        {
            id: 3,
            q_en: "A student feels extreme anger towards his strict father but does not show it. Instead, he goes to school and picks a fight with a weaker classmate. Which defense mechanism is this?",

            options: [
                { id: "A", en: "Projection", te: "ప్రక్షేపణం" },
                { id: "B", en: "Rationalization", te: "హేతుబద్ధీకరణ" },
                { id: "C", en: "Displacement", te: "విస్థాపనం (Displacement)" },
                { id: "D", en: "Regression", te: "ప్రతిగమనం" }
            ],
            answer: "C",
            hint_en: "Redirecting feelings to a less threatening target.", hint_te: "కోపాన్ని బలహీనులపై చూపించడం.",
            exp_en: "Displacement is a psychological defense mechanism in which negative feelings are transferred from the original source of the emotion to a less threatening person or object.", 
            exp_te: "ఒకరిపై (తండ్రిపై) ఉన్న కోపాన్ని, ఏమీ చేయలేని మరొకరిపై (బలహీనమైన స్నేహితునిపై) చూపించడాన్ని మనోవిజ్ఞాన శాస్త్రంలో 'విస్థాపనం' అంటారు."
        },
        {
            id: 4,
            q_en: "According to the National Education Policy (NEP) 2020, learning should be:",

            options: [
                { id: "A", en: "Textbook-centric and rote-based", te: "పాఠ్యపుస్తక-కేంద్రీకృత మరియు బట్టీ ఆధారితమైనది" },
                { id: "B", en: "Experiential, holistic, and integrated", te: "అనుభవాత్మక, సమగ్ర మరియు సమీకృతమైనది (Experiential, holistic, and integrated)" },

                { id: "D", en: "Strictly confined to classroom walls", te: "తరగతి గది గోడలకే ఖచ్చితంగా పరిమితం చేయబడటం" }
            ],
            answer: "B",
            hint_en: "Learning by doing in all domains of development.", hint_te: "అన్ని రంగాల అభివృద్ధి మరియు అనుభవాల ద్వారా నేర్చుకోవడం.",
            exp_en: "NEP 2020 emphasizes that education must move towards less rote learning and more towards experiential, holistic, integrated, inquiry-driven, and enjoyable learning.", 
            exp_te: "పిల్లల సర్వతోముఖాభివృద్ధికి (Holistic) తోడ్పడేలా, ప్రత్యక్ష అనుభవాల ద్వారా (Experiential) విద్య ఉండాలని NEP 2020 సూచించింది."
        },
        {
            id: 5,
            q_en: "In Lawrence Kohlberg's theory, an individual at the 'Post-conventional' level of moral development makes decisions based on:",
            q_te: "లారెన్స్ కోల్బర్గ్ సిద్ధాంతంలో, నైతిక వికాసంలో 'ఉత్తర-సాంప్రదాయక' (Post-conventional) స్థాయిలో ఉన్న వ్యక్తి దేని ఆధారంగా నిర్ణయాలు తీసుకుంటాడు?",
            options: [
                { id: "A", en: "Fear of punishment", te: "శిక్ష పట్ల భయం" },
                { id: "B", en: "Desire to maintain social order and laws", te: "సామాజిక క్రమం మరియు చట్టాలను కాపాడాలనే కోరిక" },
                { id: "C", en: "Internalized universal ethical principles of justice and human rights", te: "అంతర్గతీకరించబడిన సార్వత్రిక నైతిక సూత్రాలు మరియు మానవ హక్కులు" },
                { id: "D", en: "Seeking approval from peers", te: "తోటివారి నుండి ఆమోదం (మెప్పు) కోరడం" }
            ],
            answer: "C",
            hint_en: "The highest level of morality.", hint_te: "నైతికతలో అత్యున్నత స్థాయి (దశ 5 & 6).",
            exp_en: "At the post-conventional level, morality is defined in terms of abstract principles and values that apply to all situations and societies (e.g., justice, life, liberty).", 
            exp_te: "ఉత్తర-సాంప్రదాయక స్థాయిలో వ్యక్తులు చట్టాల కంటే మానవ హక్కులు, ధర్మం మరియు సార్వత్రిక నైతిక సూత్రాలకు (మహాత్మా గాంధీ వలె) ఎక్కువ ప్రాధాన్యత ఇస్తారు."
        },
        {
            id: 6,
            q_en: "A primary school teacher observes that a child frequently confuses words like 'was' for 'saw' and 'nuclear' for 'unclear'. This specific condition is known as:",
            q_te: "ఒక పిల్లవాడు తరచుగా 'was' ని 'saw' గా మరియు 'nuclear' ని 'unclear' గా గందరగోళానికి గురిచేస్తాడని ప్రాథమిక పాఠశాల ఉపాధ్యాయుడు గమనించాడు. ఈ నిర్దిష్ట పరిస్థితిని ఏమంటారు?",

                { id: "D", en: "Autism", te: "ఆటిజం" }
            ],
            answer: "B",

        },

            options: [
                { id: "A", en: "It provides immediate feedback to students.", te: "ఇది విద్యార్థులకు తక్షణ ఫీడ్‌బ్యాక్‌ను అందిస్తుంది." },

    const quizContainer = document.getElementById("quiz-container");

    function loadQuestions() {
        questionsData.forEach((q, index) => {
            let optionsHTML = '';
            q.options.forEach(opt => {
                optionsHTML += `
                    <li>
                        <label>
                            <input type="radio" name="q${q.id}" value="${opt.id}">
                            <b>${opt.id}.</b> ${opt.en} <br>
                            <span style="color:#C62828; font-size: 14px; margin-left: 25px;">${opt.te}</span>
                        </label>
                    </li>
                `;
            });

            const questionHTML = `
                <div class="question-card" id="card-${q.id}">
                    <div class="question-text">
                        <div class="lang-en">Q${index + 1}. ${q.q_en}</div>
                        <div class="lang-te">ప్ర${index + 1}. ${q.q_te}</div>
                    </div>
                    <ul class="options">
                        ${optionsHTML}
                    </ul>
                    <div class="btn-group">
                        <button class="btn-hint" onclick="showHint(${q.id})">💡 Hint</button>
                        <button class="btn-check" onclick="checkAnswer(${q.id}, '${q.answer}')">✅ Check Answer</button>
                    </div>
                    <div id="feedback-${q.id}" class="feedback-box">
                        <strong id="result-msg-${q.id}"></strong>
                        <div class="explanation">
                            <b style="color:#283593;">Explanation:</b> ${q.exp_en} <br><br>
                            <b style="color:#C62828;">వివరణ:</b> ${q.exp_te}
                        </div>
                    </div>
                </div>
            `;
            quizContainer.innerHTML += questionHTML;
        });
    }

    const hintModal = document.getElementById("hintModal");
    function showHint(id) {
        const q = questionsData.find(item => item.id === id);
        document.getElementById("hintTextEn").innerText = q.hint_en;
        document.getElementById("hintTextTe").innerText = q.hint_te;
        hintModal.style.display = "block";
    }
    function closeHint() { hintModal.style.display = "none"; }
    window.onclick = function(event) {
        if (event.target == hintModal) { hintModal.style.display = "none"; }
    }

    function checkAnswer(id, correctAnswer) {
        const selectedOption = document.querySelector(`input[name="q${id}"]:checked`);
        const feedbackBox = document.getElementById(`feedback-${id}`);
        const resultMsg = document.getElementById(`result-msg-${id}`);

        if (!selectedOption) {
            alert("Please select an option first! / దయచేసి ముందుగా ఒక ఆప్షన్ ఎంచుకోండి!");
            return;
        }

        feedbackBox.style.display = "block";
        if (selectedOption.value === correctAnswer) {
            feedbackBox.className = "feedback-box correct";
            resultMsg.innerText = "🎉 Correct Answer! / సరైన సమాధానం!";
        } else {
            feedbackBox.className = "feedback-box incorrect";
            resultMsg.innerText = `❌ Incorrect. The correct answer is '${correctAnswer}'. / తప్పు సమాధానం. సరైన ఆన్సర్ '${correctAnswer}'.`;
        }
    }

    window.onload = loadQuestions;

</script>
