<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APTET 2026 – CDP | SURESHMATHSMATERIAL | క్విజ్-14</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7fc;
            color: #212121;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px 30px 30px;
            border-radius: 14px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.10);
        }

        /* ----- HEADER ----- */
        .header-section {
            text-align: center;
            background: linear-gradient(135deg, #1B5E20, #1A237E);
            color: #ffffff;
            padding: 18px 20px 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.12);
            position: relative;
        }
        .home-link {
            position: absolute;
            top: 16px;
            right: 16px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.28);
        }
        .home-link:hover {
            background: rgba(255, 255, 255, 0.28);
        }
        .header-section .date-badge {
            display: inline-block;
            background: #FFD54F;
            color: #1A237E;
            padding: 4px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 8px;
        }
        .header-section h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .header-section h2 {
            margin: 6px 0 2px;
            font-size: 22px;
            color: #FFD54F;
            font-weight: 600;
        }
        .header-section h3 {
            margin: 0;
            font-size: 18px;
            color: #C8E6C9;
            font-weight: 400;
        }

        /* ----- TIMER & CONTROLS ----- */
        .timer-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            background: #E8F5E9;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 22px;
            border: 1px solid #A5D6A7;
        }
        .timer-box {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .timer-box span {
            font-weight: 600;
            font-size: 17px;
            color: #1B5E20;
        }
        #timerDisplay {
            font-size: 38px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            background: #1B5E20;
            color: #fff;
            padding: 6px 18px;
            border-radius: 6px;
            letter-spacing: 2px;
            min-width: 100px;
            text-align: center;
            font-family: 'Courier New', monospace;
        }
        #timerDisplay.warning {
            background: #D84315;
            animation: blink 1s ease-in-out infinite;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .timer-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .timer-actions button {
            padding: 8px 18px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.25s;
        }
        .btn-start {
            background: #2E7D32;
            color: #fff;
        }
        .btn-start:hover {
            background: #1B5E20;
        }
        .btn-start:disabled {
            background: #9E9E9E;
            cursor: not-allowed;
        }
        .btn-pause {
            background: #F57F17;
            color: #fff;
        }
        .btn-pause:hover {
            background: #E65100;
        }
        .btn-pause:disabled {
            background: #9E9E9E;
            cursor: not-allowed;
        }
        .btn-reset {
            background: #C62828;
            color: #fff;
        }
        .btn-reset:hover {
            background: #B71C1C;
        }

        .print-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .print-controls button {
            padding: 8px 18px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.25s;
        }
        .btn-print-student {
            background: #1565C0;
            color: #fff;
        }
        .btn-print-student:hover {
            background: #0D47A1;
        }
        .btn-print-teacher {
            background: #6A1B9A;
            color: #fff;
        }
        .btn-print-teacher:hover {
            background: #4A148C;
        }
        .mode-indicator {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            background: #E0E0E0;
            color: #333;
            margin-left: 6px;
        }
        .mode-indicator.student {
            background: #BBDEFB;
            color: #0D47A1;
        }
        .mode-indicator.teacher {
            background: #E1BEE7;
            color: #4A148C;
        }

        /* ----- QUESTION CARDS ----- */
        .question-card {
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 18px 22px;
            margin-bottom: 20px;
            background: #fafafa;
            transition: 0.2s;
        }
        .question-card:hover {
            border-color: #81C784;
        }
        .question-text {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .lang-en {
            color: #1B5E20;
            margin-bottom: 4px;
        }
        .lang-te {
            color: #D84315;
            margin-bottom: 8px;
        }

        .options {
            list-style: none;
            padding: 0;
            margin: 0 0 10px 0;
        }
        .options li {
            margin-bottom: 8px;
            padding: 10px 14px;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .options li:hover {
            background: #E8F5E9;
            border-color: #81C784;
        }
        .options li label {
            cursor: pointer;
            display: block;
        }
        .options li input[type="radio"] {
            margin-right: 12px;
            accent-color: #1B5E20;
        }

        .btn-group {
            margin-top: 10px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn-group button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
        }
        .btn-hint {
            background: #FFB300;
            color: #333;
        }
        .btn-hint:hover {
            background: #FF8F00;
        }
        .btn-check {
            background: #2E7D32;
            color: #fff;
        }
        .btn-check:hover {
            background: #1B5E20;
        }

        .feedback-box {
            margin-top: 12px;
            padding: 14px 16px;
            border-radius: 6px;
            display: none;
            font-size: 15px;
            border: 1px solid transparent;
        }
        .feedback-box.correct {
            display: block;
            background: #E8F5E9;
            color: #1B5E20;
            border-color: #A5D6A7;
        }
        .feedback-box.incorrect {
            display: block;
            background: #FFEBEE;
            color: #B71C1C;
            border-color: #EF9A9A;
        }
        .explanation {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #ccc;
            font-style: italic;
        }
        .explanation b {
            font-style: normal;
        }

        /* ----- HINT MODAL ----- */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
        }
        .modal-content {
            background: #fff;
            margin: 12% auto;
            padding: 24px 28px;
            border-radius: 10px;
            max-width: 550px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        .modal-content .close {
            position: absolute;
            top: 10px;
            right: 18px;
            font-size: 30px;
            font-weight: 700;
            color: #aaa;
            cursor: pointer;
            transition: 0.2s;
        }
        .modal-content .close:hover {
            color: #000;
        }
        .modal-content h3 {
            margin-top: 0;
            color: #F57F17;
        }
        .modal-content p {
            font-weight: 600;
            margin: 10px 0;
        }

        /* ----- FOOTER ----- */
        .footer-section {
            text-align: center;
            background: #E8F5E9;
            padding: 18px 20px;
            border-radius: 10px;
            margin-top: 28px;
            border: 1px solid #A5D6A7;
            color: #1B5E20;
            line-height: 1.7;
        }
        .footer-section p {
            margin: 2px 0;
            font-size: 15px;
        }
        .footer-name {
            font-size: 20px;
            font-weight: 700;
            color: #1A237E;
            margin-bottom: 4px !important;
        }

        /* ----- PRINT STYLES ----- */
        .no-print { /* elements to hide in print */ }

        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background: #fff !important;
                padding: 10px !important;
            }
            .container {
                box-shadow: none !important;
                padding: 10px !important;
                max-width: 100% !important;
            }
            .header-section {
                background: #1B5E20 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                padding: 12px !important;
                margin-bottom: 12px !important;
            }
            .header-section .date-badge {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .header-section h1 { font-size: 22px !important; }
            .header-section h2 { font-size: 18px !important; }
            .header-section h3 { font-size: 15px !important; }

            .timer-controls, .btn-group, .btn-hint, .btn-check,
            .print-controls, .timer-actions, .no-print {
                display: none !important;
            }

            .question-card {
                border: 1px solid #ddd !important;
                background: #fff !important;
                margin-bottom: 14px !important;
                padding: 14px 16px !important;
                page-break-inside: avoid !important;
            }
            .question-text { font-size: 14px !important; }
            .options li {
                border: 1px solid #ddd !important;
                background: #fff !important;
                padding: 6px 10px !important;
                margin-bottom: 4px !important;
            }
            .options li input[type="radio"] { display: none !important; }
            .options li label { cursor: default !important; }

            .feedback-box { display: none !important; }

            .footer-section {
                background: #E8F5E9 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                padding: 12px !important;
                margin-top: 16px !important;
            }

            /* Teacher mode: show answers & explanations */
            .print-teacher .feedback-box {
                display: block !important;
                background: #f5f5f5 !important;
                border: 1px solid #ccc !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                padding: 10px !important;
                margin-top: 8px !important;
            }
            .print-teacher .feedback-box.correct {
                background: #E8F5E9 !important;
                border-color: #A5D6A7 !important;
            }
            .print-teacher .feedback-box.incorrect {
                background: #FFEBEE !important;
                border-color: #EF9A9A !important;
            }
            .print-teacher .btn-group { display: none !important; }
            .print-teacher .options li input[type="radio"] { display: none !important; }

            /* Student mode: hide answers, feedback, explanations */
            .print-student .feedback-box { display: none !important; }
            .print-student .explanation { display: none !important; }
            .print-student .btn-group { display: none !important; }
            .print-student .options li input[type="radio"] { display: none !important; }

            .modal { display: none !important; }
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 700px) {
            .container { padding: 12px 14px; }
            .timer-controls { flex-direction: column; align-items: stretch; gap: 12px; }
            .timer-box { justify-content: center; }
            .timer-actions { justify-content: center; }
            .print-controls { justify-content: center; }
            #timerDisplay { font-size: 30px; min-width: 80px; padding: 4px 12px; }
            .header-section h1 { font-size: 22px; }
            .header-section h2 { font-size: 18px; }
            .modal-content { width: 95%; margin: 20% auto; }
        }
        @media (max-width: 480px) {
            #timerDisplay { font-size: 24px; min-width: 70px; padding: 3px 10px; }
            .question-card { padding: 14px 12px; }
            .options li { padding: 8px 10px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">

        <!-- HEADER -->
        <div class="header-section">
            <a class="home-link no-print" href="index.html">🏠 Home</a>
            <h2>SURESHMATHSMATERIAL</h2>

            <h1>APTET 2026 – CDP</h1>

                <span id="modeIndicator" class="mode-indicator student">విద్యార్థి మోడ్</span>
            </div> -->
        </div>

        <!-- QUIZ CONTAINER -->
        <div id="quiz-container"></div>

        <!-- FOOTER -->
        <div class="footer-section">
            <p style="color:#607D8B;font-size:14px;margin-bottom:6px;"><i>తయారు చేసినవారు</i></p>
            <p class="footer-name">K. మునీశ్వర రెడ్డి</p>

    </div>

    <!-- HINT MODAL -->
    <div id="hintModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeHint()">&times;</span>
            <h3>💡 సూచన / Hint</h3>
            <p id="hintTextEn" class="lang-en" style="font-weight:700;color:#1B5E20;"></p>
            <p id="hintTextTe" class="lang-te" style="font-weight:700;color:#D84315;"></p>
        </div>
    </div>

    <script>
        // ===================== DATA (30 fresh questions) =====================
        const questionsData = [{
            id: 1,
            q_en: "In Piaget's theory, the stage where children begin to use symbols and mental images, but lack logical reasoning, is called:",
            q_te: "పియాజె సిద్ధాంతంలో, పిల్లలు చిహ్నాలు మరియు మానసిక చిత్రాలను ఉపయోగించడం ప్రారంభించే, కానీ తార్కిక తర్కం లేని దశను ఏమంటారు?",
            options: [
                { id: "A", en: "Sensorimotor Stage", te: "ఇంద్రియ చలన దశ" },
                { id: "B", en: "Pre-operational Stage", te: "పూర్వ ప్రచాలక దశ (Pre-operational Stage)" },
                { id: "C", en: "Concrete Operational Stage", te: "మూర్త ప్రచాలక దశ" },
                { id: "D", en: "Formal Operational Stage", te: "నైరూప్య ప్రచాలక దశ" }
            ],
            answer: "B",
            hint_en: "Symbolic thinking emerges, but logic is not yet mature.",
            hint_te: "సంకేతాత్మక ఆలోచన ఉద్భవిస్తుంది, కానీ తర్కం ఇంకా పరిపక్వం చెందలేదు.",
            exp_en: "The pre-operational stage (ages 2-7) is characterized by the use of symbols, egocentrism, and lack of conservation.",
            exp_te: "పూర్వ ప్రచాలక దశ (2-7 సంవత్సరాలు) చిహ్నాల వినియోగం, అహంకేంద్రత మరియు సంరక్షణ లేకపోవడం ద్వారా వర్గీకరించబడుతుంది."
        }, {
            id: 2,
            q_en: "Vygotsky emphasized that cognitive development is heavily influenced by:",
            q_te: "వైగోట్స్కీ సంజ్ఞానాత్మక వికాసం దేని ద్వారా ఎక్కువగా ప్రభావితమవుతుందని నొక్కి చెప్పాడు?",
            options: [
                { id: "A", en: "Biological maturation alone.", te: "కేవలం జీవశాస్త్ర పరిపక్వత." },
                { id: "B", en: "Social interaction and cultural tools.", te: "సామాజిక పరస్పర చర్య మరియు సాంస్కృతిక సాధనాలు." },
                { id: "C", en: "Innate intelligence.", te: "సహజ మేధస్సు." },
                { id: "D", en: "Random chance.", te: "యాదృచ్ఛిక అవకాశం." }
            ],
            answer: "B",
            hint_en: "Learning is a social process.",
            hint_te: "అభ్యసనం ఒక సామాజిక ప్రక్రియ.",
            exp_en: "Vygotsky's sociocultural theory posits that social interaction and cultural tools (like language) are central to cognitive development.",
            exp_te: "వైగోట్స్కీ యొక్క సామాజిక-సాంస్కృతిక సిద్ధాంతం సామాజిక పరస్పర చర్య మరియు సాంస్కృతిక సాధనాలు (భాష వంటివి) సంజ్ఞానాత్మక వికాసానికి కేంద్రంగా ఉన్నాయని నొక్కి చెబుతుంది."
        }, {
            id: 3,
            q_en: "In Kohlberg's theory, the 'Good Boy/Nice Girl' orientation is characterized by a desire to:",
            q_te: "కోల్బర్గ్ సిద్ధాంతంలో, 'మంచి బాలుడు/మంచి బాలిక' (Good Boy/Nice Girl) ధోరణి దేని కోసం కోరికతో వర్గీకరించబడుతుంది?",
            options: [
                { id: "A", en: "Avoid punishment.", te: "శిక్షను నివారించండి." },
                { id: "B", en: "Gain approval and maintain social order.", te: "ఆమోదం పొందండి మరియు సామాజిక క్రమాన్ని నిలబెట్టండి." },
                { id: "C", en: "Uphold universal ethical principles.", te: "సార్వత్రిక నైతిక సూత్రాలను సమర్థించండి." },
                { id: "D", en: "Follow self-interest.", te: "స్వప్రయోజనాన్ని అనుసరించండి." }
            ],
            answer: "B",
            hint_en: "Conventional level, focusing on social approval.",

        // ===================== RENDER =====================
        const quizContainer = document.getElementById("quiz-container");

        function loadQuestions() {
            questionsData.forEach((q, index) => {
                let opts = '';
                q.options.forEach(opt => {
                    opts += `
                        <li>
                            <label>
                                <input type="radio" name="q${q.id}" value="${opt.id}">
                                <b>${opt.id}.</b> ${opt.en} <br>
                                <span style="color:#D84315;font-size:14px;margin-left:22px;">${opt.te}</span>
                            </label>
                        </li>
                    `;
                });

                const card = `
                    <div class="question-card" id="card-${q.id}">
                        <div class="question-text">
                            <div class="lang-en">Q${index+1}. ${q.q_en}</div>
                            <div class="lang-te">ప్ర${index+1}. ${q.q_te}</div>
                        </div>
                        <ul class="options">${opts}</ul>
                        <div class="btn-group no-print">
                            <button class="btn-hint" onclick="showHint(${q.id})">💡 సూచన</button>
                            <button class="btn-check" onclick="checkAnswer(${q.id},'${q.answer}')">✅ తనిఖీ</button>
                        </div>
                        <div id="feedback-${q.id}" class="feedback-box">
                            <strong id="result-msg-${q.id}"></strong>
                            <div class="explanation">
                                <b style="color:#1B5E20;">Explanation:</b> ${q.exp_en} <br><br>
                                <b style="color:#D84315;">వివరణ:</b> ${q.exp_te}
                            </div>
                        </div>
                    </div>
                `;
                quizContainer.innerHTML += card;
            });
        }

        // ===================== HINT =====================
        const hintModal = document.getElementById("hintModal");

        function showHint(id) {
            const q = questionsData.find(item => item.id === id);
            document.getElementById("hintTextEn").innerText = q.hint_en;
            document.getElementById("hintTextTe").innerText = q.hint_te;
            hintModal.style.display = "block";
        }

        function closeHint() { hintModal.style.display = "none"; }

        window.onclick = function(e) {
            if (e.target == hintModal) hintModal.style.display = "none";
        };

        // ===================== CHECK =====================
        function checkAnswer(id, correctAnswer) {
            const selected = document.querySelector(`input[name="q${id}"]:checked`);
            const box = document.getElementById(`feedback-${id}`);
            const msg = document.getElementById(`result-msg-${id}`);

            if (!selected) {
                alert("దయచేసి ఒక ఆప్షన్ ఎంచుకోండి! / Please select an option!");
                return;
            }

            box.style.display = "block";
            if (selected.value === correctAnswer) {
                box.className = "feedback-box correct";
                msg.innerText = "🎉 సరైన సమాధానం! / Correct Answer!";
            } else {
                box.className = "feedback-box incorrect";
                msg.innerText = `❌ తప్పు సమాధానం. సరైన ఆన్సర్ '${correctAnswer}'. / Incorrect. Correct answer is '${correctAnswer}'.`;
            }
        }

        // ===================== TIMER (count-up 00:00 → 30:00) =====================
        let timerSeconds = 0;
        let timerInterval = null;
        let isRunning = false;

        const timerDisplay = document.getElementById("timerDisplay");
        const btnStart = document.getElementById("btnStart");
        const btnPause = document.getElementById("btnPause");

        function updateTimerDisplay() {
            const mins = Math.floor(timerSeconds / 60);
            const secs = timerSeconds % 60;
            timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            if (timerSeconds >= 28 * 60) {
                timerDisplay.classList.add("warning");
            } else {
                timerDisplay.classList.remove("warning");
            }
        }

        function startTimer() {
            if (isRunning) return;
            if (timerSeconds >= 30 * 60) {
                alert("సమయం ముగిసింది! / Time is up!");
                return;
            }
            isRunning = true;
            btnStart.disabled = true;
            btnPause.disabled = false;
            timerInterval = setInterval(() => {
                timerSeconds++;
                updateTimerDisplay();
                if (timerSeconds >= 30 * 60) {
                    clearInterval(timerInterval);
                    isRunning = false;
                    btnStart.disabled = true;
                    btnPause.disabled = true;
                    timerDisplay.classList.add("warning");
                    alert("⏰ సమయం ముగిసింది! / Time is up!");
                }
            }, 1000);
        }

        function pauseTimer() {
            if (!isRunning) return;
            clearInterval(timerInterval);
            isRunning = false;
            btnStart.disabled = false;
            btnPause.disabled = true;
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            timerSeconds = 0;
            updateTimerDisplay();
            timerDisplay.classList.remove("warning");
            btnStart.disabled = false;
            btnPause.disabled = true;
        }

        // ===================== PRINT =====================
        function printQuiz(mode) {
            const container = document.getElementById("mainContainer");
            const indicator = document.getElementById("modeIndicator");

            container.classList.remove("print-student", "print-teacher");

            if (mode === "student") {
                container.classList.add("print-student");
                indicator.textContent = "విద్యార్థి మోడ్";
                indicator.className = "mode-indicator student";
            } else {
                container.classList.add("print-teacher");
                indicator.textContent = "ఉపాధ్యాయ మోడ్";
                indicator.className = "mode-indicator teacher";
            }

            setTimeout(() => {
                window.print();
            }, 300);
        }

        // ===================== INIT =====================
        window.onload = function() {
            loadQuestions();
            updateTimerDisplay();
        };
    </script>

</body>
</html>
